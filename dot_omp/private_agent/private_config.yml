symbolPreset: unicode
composer:
  shape: borderless
theme:
  dark: flat
  light: light
setupVersion: 2
browser:
  relay: false
  headless: false
computer:
  enabled: true
startup:
  setupWizard: false
  showSplash: false
disabledProviders:
  - cursor
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  smol: anthropic/claude-sonnet-5-5:low
  slow: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high
  task: anthropic/claude-sonnet-5-5:high
  commit: anthropic/claude-haiku-5-5:low
  vision: anthropic/claude-opus-5-5:medium
  opusmedium: anthropic/claude-opus-5-5:medium
  opushigh: anthropic/claude-opus-5-5:high
  fablehigh: anthropic/claude-fable-5-1:high
  sonnetmedium: anthropic/claude-sonnet-5-5:medium
  sonnethigh: anthropic/claude-sonnet-5-5:high
  haikulow: anthropic/claude-haiku-5-5:low
  haikumedium: anthropic/claude-haiku-5-5:medium
  solhigh: openai-codex/gpt-6.1-sol:high
  astralight: openai-codex/gpt-6-astra:low
enabledModels:
  - anthropic/claude-opus-5-5
  - anthropic/claude-fable-5-1
  - anthropic/claude-sonnet-5-5
  - anthropic/claude-haiku-5-5
  - openai-codex/gpt-6.1-sol
  - openai-codex/gpt-6-astra
cycleOrder:
  - opusmedium
  - opushigh
  - fablehigh
  - haikumedium
statusLine:
  preset: custom
  separator: thin
  sessionAccent: true
  transparent: true
  leftSegments:
    - model
    - mode
    - path
    - git
    - session_name
    - pr
  rightSegments:
    - subagents
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
spelling:
  autocomplete: "off"
  typoDetection: false
emojiAutocomplete: false
dev:
  autoqaConsent: granted
codexResets:
  autoRedeem: "yes"
skills:
  enableClaudeProject: false
  customDirectories:
    - /Users/alex/.agents/pstack-omp
claudeResets:
  autoRedeem: "yes"
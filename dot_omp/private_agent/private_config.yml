symbolPreset: unicode
composer:
  shape: borderless
theme:
  dark: flat
  light: light
setupVersion: 2
browser:
  relay: false
  headless: false
computer:
  enabled: true
startup:
  setupWizard: false
  showSplash: false
modelRoles:
  default: anthropic/claude-opus-5-5
  smol: anthropic/claude-sonnet-5:low
  slow: anthropic/claude-fable-5-1:high
  plan: openai-codex/gpt-6-astra:high
  task: anthropic/claude-sonnet-5:high
  commit: openai-codex/gpt-6-luna:low
  vision: anthropic/claude-fable-5-1
  solmedium: openai-codex/gpt-6-sol:medium
  solhigh: openai-codex/gpt-6-sol:high
  lunamax: openai-codex/gpt-6-luna:max
  astramedium: openai-codex/gpt-6-astra:medium
  astrahigh: openai-codex/gpt-6-astra:high
  astralight: openai-codex/gpt-6-astra:low
  astraxhigh: openai-codex/gpt-6-astra:xhigh
  astramax: openai-codex/gpt-6-astra:max
  fablehigh: anthropic/claude-fable-5-1:high
  opusmedium: anthropic/claude-opus-5-5:medium
  opushigh: anthropic/claude-opus-5-5:high
  sonnethigh: anthropic/claude-sonnet-5:high
enabledModels:
  - openai-codex/gpt-6-sol
  - openai-codex/gpt-6-luna
  - openai-codex/gpt-6-astra
  - anthropic/claude-fable-5
  - anthropic/claude-fable-5-1
  - anthropic/claude-opus-5-5
  - anthropic/claude-sonnet-5
cycleOrder:
  - sonnethigh
  - opushigh
  - solhigh
  - lunamax
  - astramedium
  - fablehigh
statusLine:
  preset: custom
  separator: thin
  sessionAccent: true
  transparent: true
  leftSegments:
    - model
    - mode
    - path
    - git
    - session_name
    - pr
  rightSegments:
    - subagents
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
spelling:
  autocomplete: false
  typoDetection: false
emojiAutocomplete: false
dev:
  autoqaConsent: granted
providers:
  webSearchOrder:
    []
symbolPreset: unicode
composer:
  shape: borderless
theme:
  dark: flat
  light: light
setupVersion: 2
startup:
  setupWizard: false
  showSplash: false
modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: cursor/composer-2.5-fast
  slow: cursor/claude-fable-5-high:high
  plan: openai-codex/gpt-5.6-sol:high
  task: cursor/composer-2.5-fast
  commit: cursor/composer-2.5-fast
  vision: cursor/claude-fable-5-high
  sol: openai-codex/gpt-5.6-sol:high
  luna: openai-codex/gpt-5.6-luna:max
  fable: cursor/claude-fable-5-high:high
  composer: cursor/composer-2.5
  cfast: cursor/composer-2.5-fast
  grok: cursor/cursor-grok-4.6
  gfast: cursor/cursor-grok-4.6-fast
enabledModels:
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.6-luna
  - cursor/claude-fable-5-high
  - cursor/composer-2.5
  - cursor/composer-2.5-fast
  - cursor/cursor-grok-4.6
  - cursor/cursor-grok-4.6-fast
cycleOrder:
  - cfast
  - composer
  - gfast
  - grok
  - sol
  - luna
  - fable
statusLine:
  preset: custom
  separator: thin
  sessionAccent: false
  transparent: true
  leftSegments:
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - cost
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
spelling:
  autocomplete: false
  typoDetection: false
emojiAutocomplete: false

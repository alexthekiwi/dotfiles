providers:
  webSearchOrder:
    []
symbolPreset: unicode
composer:
  shape: borderless
theme:
  dark: flat
  light: light
setupVersion: 2
browser:
  relay: false
  headless: false
computer:
  enabled: true
startup:
  setupWizard: false
  showSplash: false
modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: anthropic/claude-sonnet-5:low
  slow: anthropic/claude-fable-5-1:high
  plan: openai-codex/gpt-6-astra:high
  task: anthropic/claude-sonnet-5:high
  commit: cursor/composer-2.5-fast
  vision: anthropic/claude-fable-5-1
  sol: openai-codex/gpt-5.6-sol:high
  luna: openai-codex/gpt-5.6-luna:max
  astra: openai-codex/gpt-6-astra:medium
  fable: anthropic/claude-fable-5-1:high
  opus: anthropic/claude-opus-5:high
  sonnet: anthropic/claude-sonnet-5:high
  composer: cursor/composer-2.5
  composerfast: cursor/composer-2.5-fast
  grok: cursor/cursor-grok-4.6
  grokfast: cursor/cursor-grok-4.6-fast
enabledModels:
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.6-luna
  - openai-codex/gpt-6-astra
  - anthropic/claude-fable-5
  - anthropic/claude-fable-5-1
  - anthropic/claude-opus-5
  - anthropic/claude-sonnet-5
  - cursor/composer-2.5
  - cursor/composer-2.5-fast
  - cursor/cursor-grok-4.6
  - cursor/cursor-grok-4.6-fast
cycleOrder:
  - composerfast
  - composer
  - grokfast
  - grok
  - sonnet
  - opus
  - sol
  - luna
  - astra
  - fable
statusLine:
  preset: custom
  separator: thin
  sessionAccent: true
  transparent: true
  leftSegments:
    - model
    - mode
    - path
    - git
    - session_name
    - pr
  rightSegments:
    - subagents
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
spelling:
  autocomplete: false
  typoDetection: false
emojiAutocomplete: false
dev:
  autoqaConsent: granted